app:
  version: 1.0.0
  publisher:
    name: PingCode 团队
    email: support@pingcode.com
    phone: 400-805-1024
    site: https://pingcode.com
  links:
    - title: 服务条款
      url: https://pingcode.com/terms
    - title: 隐私政策
      url: https://pingcode.com/privacy
  id: 7fb5add3-1994-4457-99f7-2535e44b97ab
extensions:
  - key: pingcode-graphs
    target: "pcm:pjm:workitem:action"
    title: 关系图
    icon: "icons/mind-base"
    resource: main
    resolver:
      function: resolver
    type: normal
    behavior: modal
    viewport:
      size: fullscreen
functions:
  - key: resolver
    handler: index.resolver
resources:
  - key: main
    path: web/main/dist
storage:
  entities:
    - name: pc_kg_node
      attributes:
        - name: id
          type: string
          required: true
        - name: kind
          type: string
          required: true
        - name: ref_id
          type: string
          required: true
        - name: name
          type: string
          required: true
        - name: identifier
          type: string
        - name: summary
          type: string
        - name: active
          type: boolean
          default: true
        - name: source_updated_at
          type: number
        - name: synced_at
          type: number
        - name: detail
          type: object
      indexes:
        - name: id_unique
          keys:
            - id: 1
          options:
            unique: true
        - name: kind_ref
          keys:
            - kind: 1
            - ref_id: 1
          options:
            unique: true
    - name: pc_kg_edge
      attributes:
        - name: id
          type: string
          required: true
        - name: type
          type: string
          required: true
        - name: from_id
          type: string
          required: true
        - name: to_id
          type: string
          required: true
        - name: symmetric
          type: boolean
          default: false
        - name: active
          type: boolean
          default: true
        - name: synced_at
          type: number
      indexes:
        - name: id_unique
          keys:
            - id: 1
          options:
            unique: true
        - name: from_type
          keys:
            - from_id: 1
            - type: 1
        - name: to_type
          keys:
            - to_id: 1
            - type: 1
permissions:
  scopes:
    - pcp:storage:app
    - pcp:read:user:token
    - pcp:read:pjm:workitem
    - pcp:read:pjm:project
    - pcp:read:pjm:configuration
  content:
    styles:
      - unsafe-inline
