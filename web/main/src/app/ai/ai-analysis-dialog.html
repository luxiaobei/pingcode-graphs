<thy-layout class="ai-analysis">
  <thy-header thyDivided thyTitle="AI 分析">
    <ng-template #headerOperation>
      <thy-action thyIcon="close" (click)="close()"></thy-action>
    </ng-template>
  </thy-header>

  <thy-content>
    @if (loading()) {
      <div class="ai-analysis__state">
        <thy-loading></thy-loading>
      </div>
    } @else if (error()) {
      <div class="ai-analysis__state ai-analysis__state--error">
        <p>分析失败</p>
        <pre>{{ error() }}</pre>
        <button thyButton="primary" type="button" (click)="retry()">重试</button>
      </div>
    } @else if (answer()) {
      <div class="ai-analysis__answer" [innerHTML]="answerHtml()"></div>
    }
  </thy-content>
</thy-layout>
