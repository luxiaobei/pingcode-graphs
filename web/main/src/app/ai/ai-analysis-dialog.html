<thy-layout class="ai-analysis">
  <thy-header thyDivided thyTitle="AI 分析">
    <ng-template #headerOperation>
      <thy-action thyIcon="close" (click)="close()"></thy-action>
    </ng-template>
  </thy-header>

  <thy-content>
    <div class="ai-analysis__thread" #thread>
      @for (turn of turns(); track turn.id) {
        <div class="ai-analysis__turn" [attr.data-turn-id]="turn.id">
          <div class="ai-analysis__question">{{ turn.bubble }}</div>
          @switch (turn.status) {
            @case ('pending') {
              <div class="ai-analysis__answer ai-analysis__pending">
                <span class="ai-analysis__spinner" aria-hidden="true"></span>
                <span>分析中...</span>
              </div>
            }
            @case ('error') {
              <div class="ai-analysis__answer">
                <p class="ai-analysis__error">分析失败</p>
                <p class="ai-analysis__error-detail">{{ turn.error }}</p>
                <button thyButton="primary" type="button" [disabled]="busy()" (click)="retry(turn.id)">
                  重试
                </button>
              </div>
            }
            @case ('stopped') {
              <div class="ai-analysis__answer ai-analysis__pending">已停止</div>
            }
            @default {
              <div class="ai-analysis__answer" [innerHTML]="answerHtml(turn)"></div>
            }
          }
        </div>
      }
    </div>
  </thy-content>

  @if (busy()) {
    <div class="ai-analysis__stop-row">
      <button class="ai-analysis__stop" type="button" (click)="stop()">
        <span class="ai-analysis__stop-icon" aria-hidden="true"></span>
        停止回答
      </button>
    </div>
  }

  <form class="ai-analysis__composer" (ngSubmit)="sendDraft()">
    <textarea
      name="draft"
      rows="1"
      [attr.maxlength]="maxInputLength"
      placeholder="有什么问题尽管问我"
      aria-label="分析问题"
      [(ngModel)]="draft"
      (keydown)="onDraftKeydown($event)"
    ></textarea>
    <button class="ai-analysis__send" type="submit" aria-label="发送" [disabled]="!canSend()">
      <thy-icon thyName="airplane"></thy-icon>
    </button>
  </form>
</thy-layout>
