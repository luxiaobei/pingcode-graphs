<div class="page">
  <header class="toolbar">
    <div class="toolbar__heading">
      <div class="toolbar__title">
        <h1>关系图</h1>
        <p>{{ focusTitle() }}</p>
        @if (usingMockData()) {
          <span class="mock-badge">模拟数据</span>
        }
      </div>
      <button type="button" class="close-btn" (click)="closeDialog()" aria-label="关闭">×</button>
    </div>

    <div class="toolbar__controls">
      <div class="toolbar__actions">
        <div class="switch-field">
          <span>模拟数据</span>
          <thy-switch
            thySize="sm"
            [ngModel]="usingMockData()"
            (ngModelChange)="setUsingMockData($event)"
          ></thy-switch>
        </div>
        <button type="button" class="ghost-btn" (click)="openSettings()">设置</button>
        <button type="button" class="ghost-btn" (click)="reload()">刷新</button>
      </div>
    </div>
  </header>

  <main class="workspace">
    @if (loading()) {
      <div class="state">正在加载关系图…</div>
    } @else if (error()) {
      <div class="state state--error">
        <p>加载失败</p>
        <pre>{{ error() }}</pre>
        <button type="button" class="ghost-btn" (click)="reload()">重试</button>
      </div>
    } @else if (graph(); as data) {
      @if (!data.nodes.length) {
        <div class="state">暂无关联对象数据</div>
      } @else if (showCanvas()) {
        <app-graph-canvas [graph]="data" (toggleExpand)="onToggleExpand($event)" />
      }
    } @else {
      <div class="state">无法获取当前对象上下文</div>
    }
  </main>
</div>
