<thy-layout>
  @if (surface() === 'dialog') {
    <thy-header thyDivided>
      <ng-template #headerTitle>
        <span class="title-name">关系可视化</span>
      </ng-template>
      <ng-template #headerOperation>
        <thy-action
          thyIcon="close"
          thyTooltip="关闭"
          thyTooltipPlacement="bottom"
          (click)="closeDialog()"
        ></thy-action>
      </ng-template>
    </thy-header>
  }

  <thy-content>
    <div class="graph-stage">
      @if (loading()) {
        <div class="state">
          <thy-loading></thy-loading>
        </div>
      } @else if (error()) {
        <div class="state state--error">
          <p>加载失败</p>
          <pre>{{ error() }}</pre>
          <button type="button" class="ghost-btn" (click)="reload()">重试</button>
        </div>
      } @else if (graph(); as data) {
        @if (!data.nodes.length) {
          <div class="state">暂无关联对象数据</div>
        } @else {
          <app-graph-canvas
            [graph]="data"
            [showTools]="surface() === 'dialog' || surface() === 'fullscreen'"
            [relationSides]="relationSides()"
            [savedPositions]="savedLayout()?.positions ?? null"
            (toggleExpand)="onToggleExpand($event)"
            (retrace)="onRetrace($event)"
            (saveLayout)="onSaveLayout($event)"
          />
        }
      } @else {
        <div class="state">无法获取当前对象上下文</div>
      }
      @if (surface() !== 'pending') {
        <div class="graph-corner">
          @if (surface() === 'tab') {
            <thy-action
              thyIcon="expand-arrows"
              thyTooltip="全屏"
              thyTooltipPlacement="bottom"
              (click)="toggleFullscreen()"
            ></thy-action>
          } @else {
            <thy-action
              thyIcon="ai-star"
              thyTooltip="AI分析"
              thyTooltipPlacement="bottom"
            ></thy-action>
            <span class="graph-corner__split"></span>
            <thy-action
              thyIcon="settings"
              thyTooltip="设置"
              thyTooltipPlacement="bottom"
              (click)="openSettings()"
            ></thy-action>
          }
        </div>
      }
    </div>
  </thy-content>
</thy-layout>
