<thy-layout>
  <thy-header thyDivided>
    <ng-template #headerTitle>
      <span class="title-name">关系可视化</span>
    </ng-template>
    <ng-template #headerOperation>
      <div class="header-actions">
        <div class="switch-field">
          <span>模拟数据</span>
          <thy-switch
            thySize="sm"
            [ngModel]="usingMockData()"
            (ngModelChange)="setUsingMockData($event)"
          ></thy-switch>
        </div>
        <thy-action thyIcon="ai-star" thyTooltip="AI分析" thyTooltipPlacement="bottom"></thy-action>
        <thy-action
          thyIcon="settings"
          thyTooltip="设置"
          thyTooltipPlacement="bottom"
          (click)="openSettings()"
        ></thy-action>
        <thy-divider thyVertical class="m-0"></thy-divider>
        <thy-action
          thyIcon="close"
          thyTooltip="关闭"
          thyTooltipPlacement="bottom"
          (click)="closeDialog()"
        ></thy-action>
      </div>
    </ng-template>
  </thy-header>

  <thy-content>
    @if (loading()) {
      <div class="state">正在加载关系图…</div>
    } @else if (error()) {
      <div class="state state--error">
        <p>加载失败</p>
        <pre>{{ error() }}</pre>
        <button type="button" class="ghost-btn" (click)="reload()">重试</button>
      </div>
    } @else if (graph(); as data) {
      @if (!data.nodes.length) {
        <div class="state">暂无关联对象数据</div>
      } @else if (showCanvas()) {
        <app-graph-canvas [graph]="data" (toggleExpand)="onToggleExpand($event)" />
      }
    } @else {
      <div class="state">无法获取当前对象上下文</div>
    }
  </thy-content>
</thy-layout>
