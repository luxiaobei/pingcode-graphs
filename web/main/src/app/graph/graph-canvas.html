<div class="canvas-shell">
  <div #g6Host class="g6-host"></div>
  @if (showTools()) {
  <div class="canvas-tools">
    <div class="canvas-toolbar" role="toolbar" aria-label="画布操作">
      <thy-action
        thyIcon="aim"
        thyTooltip="定位"
        thyTooltipPlacement="top"
        (click)="locate()"
      ></thy-action>
      <span class="canvas-toolbar__split"></span>
      <thy-action
        thyIcon="zoom-out"
        thyTooltip="缩小"
        thyTooltipPlacement="top"
        [thyDisabled]="!canZoomOut()"
        (click)="zoomOut()"
      ></thy-action>
      <thy-action
        class="canvas-toolbar__zoom"
        [class.canvas-toolbar__zoom--current]="zoomPercent() === 100"
        thyTooltip="恢复 100%"
        thyTooltipPlacement="top"
        [thyTooltipDisabled]="zoomPercent() === 100"
        (click)="resetZoom()"
      >{{ zoomPercent() }}%</thy-action>
      <thy-action
        thyIcon="zoom-in"
        thyTooltip="放大"
        thyTooltipPlacement="top"
        [thyDisabled]="!canZoomIn()"
        (click)="zoomIn()"
      ></thy-action>
      <span class="canvas-toolbar__split"></span>
      <thy-action
        thyIcon="fit-screen"
        thyTooltip="适应画布"
        thyTooltipPlacement="top"
        (click)="fit()"
      ></thy-action>
      <span class="canvas-toolbar__split"></span>
      <thy-action
        thyIcon="organization"
        thyTooltip="一键整理"
        thyTooltipPlacement="top"
        (click)="organize()"
      ></thy-action>
    </div>
    <div class="canvas-save">
      <thy-action
        thyIcon="save"
        thyTooltip="保存"
        thyTooltipPlacement="top"
        (click)="save()"
      ></thy-action>
    </div>
  </div>
  }
  <span
    #traceOrigin
    class="trace-origin"
    [thyDropdown]="traceMenu"
    thyPlacement="rightTop"
    thyPanelClass="trace-menu-panel"
    [thyPopoverOptions]="{ minWidth: '0' }"
    (thyActiveChange)="onTraceMenuActive($event)"
  ></span>
  <thy-dropdown-menu #traceMenu>
    <a thyDropdownMenuItem (click)="confirmTrace()">
      <span thyDropdownMenuItemName>以此工作项追溯</span>
    </a>
  </thy-dropdown-menu>
</div>
